name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ae-orlando

      # The action generates every theme variant, but the README only embeds
      # profile-night-green.svg — drop the rest so they never hit the repo.
      - name: Keep only the README variant
        run: find profile-3d-contrib -type f -name '*.svg' ! -name 'profile-night-green.svg' -delete

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update 3d contrib [skip ci]"
          file_pattern: profile-3d-contrib/*
          disable_globbing: true
